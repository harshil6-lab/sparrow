<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Sparrow - The Indian Energy Saver banner">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4FB3D9"/>
      <stop offset="0.55" stop-color="#BFE8E0"/>
      <stop offset="1" stop-color="#FFF1C9"/>
    </linearGradient>
    <linearGradient id="h1" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6CC07A"/>
      <stop offset="1" stop-color="#3C8550"/>
    </linearGradient>
    <linearGradient id="h2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2F7A4A"/>
      <stop offset="1" stop-color="#174A30"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E5B9A"/>
      <stop offset="1" stop-color="#16346B"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFE59A"/>
      <stop offset="1" stop-color="#FFB547" stop-opacity="0"/>
    </radialGradient>
    <g id="turbine">
      <rect x="-3" y="0" width="6" height="90" fill="#F4F7F5"/>
      <circle cx="0" cy="0" r="6" fill="#E3EAE6"/>
      <g>
        <path d="M0 0 L-4 -48 L4 -48Z" fill="#FFFFFF"/>
        <path d="M0 0 L-4 -48 L4 -48Z" fill="#FFFFFF" transform="rotate(120)"/>
        <path d="M0 0 L-4 -48 L4 -48Z" fill="#FFFFFF" transform="rotate(240)"/>
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
      </g>
    </g>
    <g id="bird">
      <path d="M0 0 Q6 -7 12 0 Q18 -7 24 0" stroke="#3B4A52" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </defs>

  <rect width="1200" height="420" fill="url(#sky)"/>

  <!-- sun -->
  <circle cx="1030" cy="95" r="130" fill="url(#sun)">
    <animate attributeName="r" values="115;140;115" dur="6s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1030" cy="95" r="40" fill="#FFD166"/>
  <g stroke="#FFD166" stroke-width="3" stroke-linecap="round" opacity="0.8">
    <g transform="translate(1030 95)">
      <path d="M0 -58 V-74 M0 58 V74 M-58 0 H-74 M58 0 H74 M41 -41 L52 -52 M-41 41 L-52 52 M41 41 L52 52 M-41 -41 L-52 -52"/>
      <animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="40s" repeatCount="indefinite" additive="sum"/>
    </g>
  </g>

  <!-- clouds -->
  <g fill="#FFFFFF" opacity="0.88">
    <g>
      <ellipse cx="230" cy="86" rx="62" ry="18"/><ellipse cx="272" cy="73" rx="40" ry="16"/><ellipse cx="195" cy="76" rx="32" ry="13"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;70 0;0 0" dur="32s" repeatCount="indefinite"/>
    </g>
    <g>
      <ellipse cx="660" cy="56" rx="52" ry="14"/><ellipse cx="697" cy="47" rx="34" ry="12"/>
      <animateTransform attributeName="transform" type="translate" values="0 0;-60 0;0 0" dur="28s" repeatCount="indefinite"/>
    </g>
  </g>

  <!-- flying birds -->
  <g>
    <use href="#bird" x="400" y="120"/>
    <use href="#bird" x="430" y="140"/>
    <use href="#bird" x="372" y="146"/>
    <animateTransform attributeName="transform" type="translate" values="-200 0;1500 0" dur="38s" repeatCount="indefinite"/>
  </g>

  <!-- far hills -->
  <path d="M0 290 Q180 235 380 280 T760 265 T1200 285 L1200 420 L0 420Z" fill="#8FD0A0" opacity="0.8"/>

  <!-- wind turbines -->
  <g transform="translate(300 190)"><use href="#turbine"/></g>
  <g transform="translate(420 215) scale(0.8)"><use href="#turbine"/></g>
  <g transform="translate(900 205) scale(0.9)"><use href="#turbine"/></g>
  <g transform="translate(1010 228) scale(0.7)"><use href="#turbine"/></g>

  <!-- near hills -->
  <path d="M0 320 Q200 270 440 315 T860 300 T1200 318 L1200 420 L0 420Z" fill="url(#h1)"/>
  <path d="M0 365 Q260 325 540 358 T1040 348 T1200 360 L1200 420 L0 420Z" fill="url(#h2)"/>

  <!-- solar panels on roof -->
  <g transform="translate(1020 318)">
    <path d="M-70 40 L-70 8 L0 -26 L70 8 L70 40Z" fill="#C9694B"/>
    <rect x="-70" y="40" width="140" height="38" fill="#F2E3C8"/>
    <rect x="-12" y="52" width="24" height="26" fill="#7A5230"/>
    <g transform="skewY(-25)">
      <rect x="2" y="4" width="54" height="22" fill="url(#panel)" stroke="#E7EEF7" stroke-width="1.5"/>
      <path d="M20 4 V26 M38 4 V26 M2 15 H56" stroke="#9DB7DA" stroke-width="1"/>
    </g>
  </g>

  <!-- tree -->
  <g>
    <rect x="96" y="238" width="14" height="95" rx="5" fill="#6B4A2F"/>
    <circle cx="103" cy="216" r="48" fill="#2F8F5B"/>
    <circle cx="68" cy="238" r="30" fill="#3FA56B"/>
    <circle cx="140" cy="234" r="32" fill="#3FA56B"/>
    <animateTransform attributeName="transform" type="rotate" values="-0.7 103 333;0.7 103 333;-0.7 103 333" dur="5s" repeatCount="indefinite"/>
  </g>

  <!-- wire -->
  <path d="M0 170 Q300 196 600 180 T1200 170" stroke="#44505A" stroke-width="2.5" fill="none"/>
  <g transform="translate(150 158)">
    <ellipse cx="0" cy="0" rx="17" ry="12" fill="#9C6B3F"/><circle cx="15" cy="-8" r="8" fill="#A87848"/>
    <path d="M22 -8 L30 -6 L22 -4Z" fill="#F2A33A"/><circle cx="17" cy="-10" r="1.6" fill="#1D1D1D"/>
    <path d="M-14 0 L-30 6 L-12 6Z" fill="#7A5230"/><path d="M-4 -2 Q4 -10 10 0 Q2 6 -4 -2Z" fill="#7A5230"/>
    <animateTransform attributeName="transform" type="translate" values="150 158;150 155;150 158" dur="2.4s" repeatCount="indefinite"/>
  </g>
  <g transform="translate(205 164) scale(0.8)">
    <ellipse cx="0" cy="0" rx="17" ry="12" fill="#B07C4A"/><circle cx="15" cy="-8" r="8" fill="#BC8955"/>
    <path d="M22 -8 L30 -6 L22 -4Z" fill="#F2A33A"/><circle cx="17" cy="-10" r="1.6" fill="#1D1D1D"/>
    <path d="M-14 0 L-30 6 L-12 6Z" fill="#7A5230"/>
  </g>

  <!-- drifting leaves -->
  <g fill="#7BCF8E">
    <path d="M0 0 Q8 -6 16 0 Q8 6 0 0Z"><animateMotion dur="14s" repeatCount="indefinite" path="M300 -10 C380 90 260 180 340 280 S420 380 380 440"/></path>
    <path d="M0 0 Q8 -6 16 0 Q8 6 0 0Z"><animateMotion dur="18s" begin="3s" repeatCount="indefinite" path="M760 -10 C700 100 820 190 740 290 S690 380 720 440"/></path>
    <path d="M0 0 Q8 -6 16 0 Q8 6 0 0Z"><animateMotion dur="16s" begin="6s" repeatCount="indefinite" path="M560 -10 C600 100 520 200 580 300 S620 380 600 440"/></path>
  </g>

  <!-- title -->
  <g font-family="'Noto Sans','Segoe UI',Arial,sans-serif" text-anchor="middle">
    <text x="600" y="258" font-size="92" font-weight="800" fill="#143D29" stroke="#FFFFFF" stroke-width="7" paint-order="stroke">Sparrow</text>
    <text x="600" y="300" font-size="29" font-weight="600" fill="#1F5C3A" stroke="#FFFFFF" stroke-width="4" paint-order="stroke">The Indian Energy Saver</text>
    <text x="600" y="342" font-size="17" font-weight="600" fill="#FFF8E6" letter-spacing="4">SEE IT  ·  SAVE IT  ·  PROVE IT</text>
  </g>
</svg>
