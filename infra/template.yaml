AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Chiri backend

Globals:
  Function:
    Runtime: python3.12
    Timeout: 15
    MemorySize: 256

Resources:
  HouseholdsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - {AttributeName: pk, AttributeType: S}
        - {AttributeName: sk, AttributeType: S}
      KeySchema:
        - {AttributeName: pk, KeyType: HASH}
        - {AttributeName: sk, KeyType: RANGE}

  Api:
    Type: AWS::Serverless::HttpApi
    Properties:
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowMethods: [GET, POST, OPTIONS]
        AllowHeaders: ['*']

  HelloFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend.handlers.api.hello
      Events:
        Get:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /hello, Method: GET}

  MissionFn:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: ../
      Handler: backend.handlers.api.mission
      Environment:
        Variables: {TABLE: !Ref HouseholdsTable}
      Policies:
        - DynamoDBCrudPolicy: {TableName: !Ref HouseholdsTable}
      Events:
        Post:
          Type: HttpApi
          Properties: {ApiId: !Ref Api, Path: /mission, Method: POST}

Outputs:
  ApiUrl:
    Value: !Sub "https://${Api}.execute-api.${AWS::Region}.amazonaws.com"
